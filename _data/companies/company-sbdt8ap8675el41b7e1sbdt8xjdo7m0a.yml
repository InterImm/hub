author: Traveler.No1
name: 群狼普通与高等警察大学
founded: '2035-07-01'
base: 火星天狼城(Betelgeuse City)：2123 年成立；伊希地城市圈
category: 教育
link: https://www.gatherwolves.com.cn
about: 
  时属群星集团、火星联盟、人类联邦、群狼军事学院四大不同类型星际组织共同合作创办该校，主要为城市文明与环行星星轨文明的普通与高等警察现役部队培养指挥管理和专业技术警官，承担人联与火联维和警察、成建制人联和火联的普通与高等警察防暴队、常备人联与火联维和警队、驻外行星与驻外行星星轨警务联络官和本星系警察培训任务，担负火联警备机关培训工作。主要面向全火星警备机关，培养适应新星际时代警备工作创新发展的新型警务人才；面向火星与各行星移民管理队伍，培养移民和出入各类行星星境管理人才；面向人联警备以及星系警备的本星系执法安全合作，培养本星系执法合作人才和人联警察；面向人联维和事业，培养各类人联维和警务人才；面向全星系社会行业消防队伍，培养消防工程技术和指挥管理类人才；面向星系组织有关治安组织委员会和“走出去战略”的群狼军事企业，培养本星系安全管理人才。
