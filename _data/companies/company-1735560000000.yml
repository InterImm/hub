about: >-
  是一家立足未来行星医学的前沿医药研发公司，致力于在极端环境与深空条件下推动人类生命科学与生物医药技术的突破。公司以"让生命适应火星，让医学走向宇宙"为使命，聚焦于火星及类火星环境下的疾病机制研究、新型药物开发与生物技术创新。

  NeorabioMars 围绕太空医学、基因与细胞治疗、极端环境药物稳定性、生物材料与再生医学等方向，构建了完整的研发体系。公司结合地外低重力、高辐射、资源受限等独特条件，开发更高效、更稳定、更具适应性的创新药物与解决方案，为未来深空探索与星际定居提供坚实的医学保障。

  依托跨学科科研团队与先进实验平台，NeorabioMars 持续推动基础研究向临床与应用转化，不仅服务于火星及太空医学需求，也反向赋能地球上的疑难疾病治疗与生命健康产业升级。
date: '2025-12-30'
