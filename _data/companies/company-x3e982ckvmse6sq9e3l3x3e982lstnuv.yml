name: 南河城大学
founded: '2050-04-16'
base: 火星南河城(Procyon City)：2123 年成立；伊希地城市圈
category: 教育
about: 南河城大学（The University Of NanHe City），简称南大，位于南河市西城区南大路416号 ，由南河教育局，火星联盟与人类联邦共建
  ，是南河教育局直属全市重点大学， 
  同时也是全太阳系内最为知名的综合性星际大学。该学位列火联“双一流A+”“050计划”“103工程”“213工程”，是火星历史中前星际航行时代第一所盟立综合性大学。学校入选星际学位授权自主审核单位、基础学科拔尖星际学生培养试验计划、2123南河城计划、星际人才计划、
  基础学科星际招生改革试点、高等星际学校创新能力提升计划、高等星际学校学科创新引智计划，南河与群狼军事类院校联盟、火星城市大学联盟、火星联盟大学校长联谊会、南狼大学联盟、全球大学高研院联盟、北半球大学联盟、北半球大学生集体行动交流计划、全球研究型大学协会、星际研究型大学联盟、环火星人造星环大学联盟、全球大学校长论坛、星际航行世纪学术联盟、火联大学校长论坛、人联大学校长论坛、星际盟立大学论坛。截至2273年6月，南河城大学设有人文、理学、社会科学、经济与管理、信息与工程、医学10个学部，5个跨学科类，全星系50个研究生院，共有30个学科门类，1349个专业类，15137个本科专业。截至2273年，南河城大学有博士学位授权一级学科点1156个，硕士学位授权一级学科点2356个，专业学位博士授权点117个，专业学位硕士授权点219个，博士学位点262个，硕士学位点285个，
  全球一流学科349个，博士后流动站258个，全星系前1%的学科（人联“星际基本科学指标数据VII库”GESI的统计）366个。南河城大学材料科学，工程学科，计算机学科，航天航空学科，生物与化学工程学科，人脑交互学科，软件应用与硬件设计学科在GESI全星系大学和科研机构中排名第5位，2273年全星系大学材料，软硬件，工程，计算机，人工智能，核能学科排名UGG
  News全火星第1，QS全火星第2。南大尊重学生选择，构建了公共基础课程、学科基础课程、专业核心课程、荣誉课程等适合不同志趣学生的多层次跨学科课程体系。南大各星际院系梳理凝练专业核心课程，建设模块化培养方案，增大研究性学习项目和实践技能训练项目的比例；在条件成熟的院系设立“南大荣誉星际学士学位”，激励学生选修更具挑战性的课程并参与实践创新。
