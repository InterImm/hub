# InterImm Company Hub: interimm.org/hub. Built by GitHub Pages from the gh-pages branch.
title: 星际企业中心
title_en: Company Hub
description: 星际移民中心企业登记处：在火星找工作，登记你自己的星际企业，并在企业办公室里经营它。
baseurl: '/hub'

# Front desk (Cloudflare Worker in desk/, see desk/README.md). Leave desk_url empty to close
# registration; the page then shows the desks but says registration is not open yet.
desk_url: "https://desk.interimm.org"
turnstile_sitekey: "0x4AAAAAAFNeYSMJzUA7HWaV"

timezone: UTC
markdown: kramdown
encoding: utf-8

# Each company is one file in _companies/; its front matter is the register entry.
collections:
  companies:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: companies
    values:
      layout: company

exclude: [desk, node_modules, README.md, Gemfile, Gemfile.lock, LICENSE]
